services:
  backend:
    build: .
    container_name: learning-app-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - APP_ENV=${APP_ENV}
      - TZ=Asia/Shanghai
      - APP_TIMEZONE=Asia/Shanghai
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - STORE_IMAGE_RAW=${STORE_IMAGE_RAW:-0}
      # 云端多模态兜底：只填 VLM_API_KEY 即可使用默认智谱兼容接口；未填时完全关闭。
      - VLM_API_KEY=${VLM_API_KEY:-}
      - VLM_BASE_URL=${VLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      - VLM_MODEL=${VLM_MODEL:-glm-4v-flash}
      - VLM_TIMEOUT=${VLM_TIMEOUT:-25}
      - VLM_ACCEPT_MIN_CONF=${VLM_ACCEPT_MIN_CONF:-0.75}
      - VLM_GLOBAL_MIN_SECONDS=${VLM_GLOBAL_MIN_SECONDS:-60}
      - VLM_KEY_RETRY_SECONDS=${VLM_KEY_RETRY_SECONDS:-300}
      - VLM_CACHE_TTL_HOURS=${VLM_CACHE_TTL_HOURS:-6}
      - VLM_MAX_IMAGES=${VLM_MAX_IMAGES:-3}
      - VLM_FRAME_LOOKBACK_SECONDS=${VLM_FRAME_LOOKBACK_SECONDS:-180}
      - VLM_REQUIRE_LOW_OCR=${VLM_REQUIRE_LOW_OCR:-0}
      - VLM_AUTO_RULE_ENABLED=${VLM_AUTO_RULE_ENABLED:-0}
      - VLM_RULE_MIN_CONF=${VLM_RULE_MIN_CONF:-0.90}
      - VLM_RULE_CONFIRMATIONS=${VLM_RULE_CONFIRMATIONS:-2}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - learning-app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: learning-app-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - learning-app-network
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  learning-app-network:
    driver: bridge
